[package]
name = "jp-address-search"
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
description = "Fast, zero-dependency Japanese address search: postal code (zipcode) to address, prefecture and city master data, and municipality latitude/longitude. 日本の郵便番号・住所検索・市区町村の緯度経度取得ライブラリ"
license = "MIT"
repository = "https://github.com/uiuifree/rust-jp-address-search"
readme = "README.md"
keywords = ["japan", "address", "zipcode", "geocoding", "postal-code"]
categories = ["localization", "science::geo"]

[features]
# データ生成用バイナリ(update_master / update_address)を有効にする
generate = ["dep:calamine", "dep:csv"]

[dependencies]
calamine = { version = "0.21", optional = true }
csv = { version = "1", optional = true }

[[bin]]
name = "update_master"
required-features = ["generate"]

[[bin]]
name = "update_address"
required-features = ["generate"]

[[bin]]
name = "update_city_location"
required-features = ["generate"]
