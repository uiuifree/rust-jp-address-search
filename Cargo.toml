[package]
name = "jp-address-search"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "Fast, zero-dependency Japanese address search by postal code (zipcode), prefecture, and city. 日本の郵便番号・都道府県・市区町村の住所検索ライブラリ"
license = "MIT"
repository = "https://github.com/uiuifree/rust-jp-address-search"
readme = "README.md"
keywords = ["japan", "address", "zipcode", "postal-code", "japanese"]
categories = ["localization"]

[features]
# データ生成用バイナリ(update_master / update_address)を有効にする
generate = ["dep:calamine", "dep:csv"]

[dependencies]
calamine = { version = "0.21", optional = true }
csv = { version = "1", optional = true }

[[bin]]
name = "update_master"
required-features = ["generate"]

[[bin]]
name = "update_address"
required-features = ["generate"]
